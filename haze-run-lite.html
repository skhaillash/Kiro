</head><body><canvas id="c"></canvas>
<script>
/* HAZE RUN: Malaysia Survival Crisis - single-file build. All air-quality values are SIMULATED, not official. */
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let VW=0,VH=0;
function resize(){const d=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*d;cv.height=VH*d;cv.style.width=VW+'px';cv.style.height=VH+'px';ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const WW=2400,WH=1600,GW=48,GH=32,CS=50,TOP=100;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
function mkrng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296;}
function mix(a,b,t){return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';}
function hit(a,b,m){m=m||0;return a.x<b.x+b.w+m&&a.x+a.w+m>b.x&&a.y<b.y+b.h+m&&a.y+a.h+m>b.y;}
function T(s,x,y,size,col,al,wt){ctx.font=(wt||'600')+' '+size+'px system-ui,Segoe UI,sans-serif';ctx.fillStyle=col||'#fff';ctx.textAlign=al||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrap(s,x,y,maxw,lh,size,col){ctx.font='500 '+size+'px system-ui,sans-serif';ctx.fillStyle=col||'#eee';ctx.textAlign='left';const words=s.split(' ');let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxw&&line){ctx.fillText(line,x,y);y+=lh;line=w;}else line=t;}ctx.fillText(line,x,y);return y+lh;}

/* ---------- AUDIO (WebAudio synth, no files) ---------- */
let AC=null,windGain=null,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    const len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=b;src.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
    windGain=AC.createGain();windGain.gain.value=0;src.connect(f);f.connect(windGain);windGain.connect(AC.destination);src.start();}catch(e){AC=null;}
}
function tone(fr,dur,type,vol,slide){if(!AC||muted)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(fr,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,fr+slide),t+dur);g.gain.setValueAtTime(vol||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur);}catch(e){}}
const sfx={chime(){tone(660,.1,'sine',.12);setTimeout(()=>tone(990,.18,'sine',.12),90);},cough(){tone(150,.14,'square',.07,-70);},click(){tone(500,.05,'triangle',.08);},
  siren(){for(let k=0;k<6;k++)setTimeout(()=>tone(520,.48,'sawtooth',.09,520),k*520);},splash(){tone(900,.06,'sine',.04,-400);},hurt(){tone(110,.2,'sawtooth',.1,-40);},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.12),i*140));}};

/* ---------- WORLD (static, procedural Malaysian town) ---------- */
const SHELTERS=[{n:'HOSPITAL',x:1100,y:560,w:260,h:180,c:'#ececf2',r:'#d94141'},{n:'SEKOLAH',x:260,y:300,w:240,h:160,c:'#f2d98a',r:'#c05a5a'},{n:'MASJID',x:1780,y:1000,w:240,h:170,c:'#e2f0e4',r:'#2a8f6c'}];
const ROADS=[{x:0,y:800,w:WW,h:80},{x:1000,y:0,w:80,h:WH}];
const PLANT={x:1500,y:1250,w:900,h:350};
const HYD=[{x:900,y:770},{x:1500,y:910},{x:500,y:770}];
const HOUSES=[],PALMS=[];
(function(){const r=mkrng(11),signs=['MAMAK','KEDAI','PASAR','ROTI CANAI','KOPITIAM'];let tries=0;
  while(HOUSES.length<24&&tries++<3000){const w=90+r()*70,h=80+r()*60,b={x:60+r()*(WW-120-w),y:60+r()*(WH-120-h),w,h};
    if([...SHELTERS,...ROADS,PLANT,...HOUSES].some(o=>hit(b,o,40)))continue;
    b.col=['#c97b5a','#d9b26f','#8fb0c9','#b58fc9','#c9c46b'][Math.floor(r()*5)];b.sign=r()<0.4?signs[Math.floor(r()*5)]:null;HOUSES.push(b);}
  tries=0;while(PALMS.length<50&&tries++<3000){const p={x:30+r()*(WW-60),y:30+r()*(WH-60),w:0,h:0};const bb={x:p.x-14,y:p.y-14,w:28,h:28};
    if([...SHELTERS,...ROADS,PLANT,...HOUSES].some(o=>hit(bb,o,10)))continue;PALMS.push(p);}})();
const stat=document.createElement('canvas');stat.width=WW;stat.height=WH;
function palm(g,x,y,s){g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.ellipse(x+4,y+4,16*s,9*s,0,0,7);g.fill();for(let k=0;k<8;k++){const a=k*Math.PI/4;g.strokeStyle=k%2?'#2c7a35':'#389a44';g.lineWidth=5*s;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*17*s,y+Math.sin(a)*17*s);g.stroke();}g.fillStyle='#6b4a22';g.beginPath();g.arc(x,y,3.5*s,0,7);g.fill();}
(function buildStatic(){const g=stat.getContext('2d');
  for(let gy=0;gy<16;gy++)for(let gx=0;gx<24;gx++){g.fillStyle=(gx+gy)%2?'#4d7c3c':'#497838';g.fillRect(gx*100,gy*100,100,100);}
  g.fillStyle='#2d4a28';g.fillRect(PLANT.x,PLANT.y,PLANT.w,PLANT.h);
  for(let y=PLANT.y+25;y<PLANT.y+PLANT.h;y+=55)for(let x=PLANT.x+25;x<PLANT.x+PLANT.w;x+=60)palm(g,x,y,.8);
  g.font='700 20px system-ui';g.fillStyle='rgba(255,255,255,.55)';g.fillText('KEBUN SAWIT (oil palm plantation / peat edge)',PLANT.x+20,PLANT.y-8);
  for(const r of ROADS){g.fillStyle='#55565c';g.fillRect(r.x,r.y,r.w,r.h);g.strokeStyle='#e8d85a';g.lineWidth=3;g.setLineDash([22,18]);g.beginPath();if(r.w>r.h){g.moveTo(r.x,r.y+r.h/2);g.lineTo(r.x+r.w,r.y+r.h/2);}else{g.moveTo(r.x+r.w/2,r.y);g.lineTo(r.x+r.w/2,r.y+r.h);}g.stroke();g.setLineDash([]);}
  for(const s of SHELTERS){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(s.x+8,s.y+8,s.w,s.h);g.fillStyle=s.c;g.fillRect(s.x,s.y,s.w,s.h);g.fillStyle=s.r;g.fillRect(s.x,s.y,s.w,26);g.strokeStyle='#fff';g.lineWidth=3;g.strokeRect(s.x,s.y,s.w,s.h);
    g.font='800 20px system-ui';g.fillStyle='#fff';g.textAlign='center';g.fillText(s.n,s.x+s.w/2,s.y+20);g.fillStyle='rgba(30,120,200,.35)';g.fillRect(s.x+10,s.y+34,s.w-20,s.h-44);g.font='700 14px system-ui';g.fillStyle='#17507c';g.fillText('CLEAN AIR SHELTER',s.x+s.w/2,s.y+s.h/2+20);
    if(s.n==='HOSPITAL'){g.fillStyle='#d94141';g.fillRect(s.x+s.w/2-6,s.y+s.h/2-48,12,32);g.fillRect(s.x+s.w/2-16,s.y+s.h/2-38,32,12);}
    if(s.n==='MASJID'){g.fillStyle='#d8c36a';g.beginPath();g.arc(s.x+s.w/2,s.y+s.h/2-30,22,Math.PI,0);g.fill();}}
  for(const b of HOUSES){g.fillStyle='rgba(0,0,0,.28)';g.fillRect(b.x+7,b.y+7,b.w,b.h);g.fillStyle=b.col;g.fillRect(b.x,b.y,b.w,b.h);g.fillStyle='rgba(60,30,20,.55)';g.fillRect(b.x+6,b.y+6,b.w-12,b.h-12);g.fillStyle='rgba(120,60,40,.7)';g.fillRect(b.x+10,b.y+10,b.w-20,b.h/2-10);g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=2;g.strokeRect(b.x,b.y,b.w,b.h);
    if(b.sign){g.font='800 13px system-ui';g.textAlign='center';g.shadowColor='#ff3d8b';g.shadowBlur=10;g.fillStyle='#ffd1e6';g.fillText(b.sign,b.x+b.w/2,b.y-6);g.shadowBlur=0;}}
  g.textAlign='left';for(const p of PALMS)palm(g,p.x,p.y,1);
})();

/* ---------- LEVELS & CONTENT ---------- */
const LEVELS=[
 {name:'DAY 1 - Klang Valley',sub:'Moderate haze. Learn the ropes.',inflow:0.12,civs:5,goal:3,fireGoal:2,fireInt:22,frontAt:50,spikeAt:110,fires0:2},
 {name:'DAY 2 - Peat Fire Crisis, Selangor',sub:'Transboundary smoke + local peat fires.',inflow:0.24,civs:6,goal:4,fireGoal:3,fireInt:14,frontAt:38,spikeAt:90,fires0:3},
 {name:'DAY 3 - Hazardous Emergency',sub:'API 300+. Schools closed. Hold the line.',inflow:0.38,civs:7,goal:5,fireGoal:4,fireInt:10,frontAt:28,spikeAt:70,fires0:4}];
const FACTS=[
 'PM2.5 are particles 2.5 micrometres or smaller. They are small enough to reach deep into the lungs and even enter the bloodstream.',
 'Haze in Malaysia comes mainly from open burning and peatland fires, including transboundary smoke from Sumatra and Kalimantan, worst in dry El Nino seasons. Vehicles and industry add to it.',
 'Malaysia reports the Air Pollutant Index (API): Good 0-50, Moderate 51-100, Unhealthy 101-200, Very Unhealthy 201-300, Hazardous above 300.',
 'A properly fitted N95 respirator filters most fine particles. Ordinary surgical or cloth masks are far less effective against PM2.5.',
 'Children, the elderly, pregnant women and people with asthma, heart or lung disease are most vulnerable to haze.',
 'In heavy haze: stay indoors, close windows, use air-conditioning or a purifier with a good filter, drink water, and avoid strenuous outdoor activity.',
 'Outdoor activities are restricted and schools may close when the API reaches unhealthy levels. Always follow official announcements.',
 'For real readings, use the Department of Environment Malaysia (APIMS) and MetMalaysia. This game uses SIMULATED values only.'];
const DISCLAIMER='All air-quality values in this game are SIMULATED and fictional. They are NOT official readings. For real data see DOE Malaysia (APIMS) and MetMalaysia.';
function cat(a){return a<=50?['GOOD','#3ec46d']:a<=100?['MODERATE','#e5d636']:a<=200?['UNHEALTHY','#f08a24']:a<=300?['VERY UNHEALTHY','#e0402f']:['HAZARDOUS','#b02ea0'];}
const ACH={hero:['Kampung Hero','Rescue every civilian with none lost'],fire:['Fire Fighter','Put out every fire on a level'],lungs:['Clean Lungs','Finish with lung damage under 25%'],n95:['Never Without N95','Finish a level without the mask running out']};
let SAVE={best:0,badges:{}};try{SAVE=Object.assign(SAVE,JSON.parse(localStorage.getItem('hazerun')||'{}'));}catch(e){}
function save(){try{localStorage.setItem('hazerun',JSON.stringify(SAVE));}catch(e){}}

/* ---------- STATE ---------- */
let scene='menu',G=null,levelIdx=0,runScore=0,tm=0,mouse={x:0,y:0},frameBtns=[],showDir=true,endInfo=null;
const keys={};
const hc=document.createElement('canvas');hc.width=GW;hc.height=GH;const hctx=hc.getContext('2d');const himg=hctx.createImageData(GW,GH);
const fcv=document.createElement('canvas');fcv.width=GW;fcv.height=GH;const fctx=fcv.getContext('2d');const fimg=fctx.createImageData(GW,GH);
function blocked(x,y,r){if(x<r||y<r||x>WW-r||y>WH-r)return true;for(const b of HOUSES)if(x>b.x-r&&x<b.x+b.w+r&&y>b.y-r&&y<b.y+b.h+r)return true;return false;}
function moveE(o,dx,dy,r){if(!blocked(o.x+dx,o.y,r))o.x+=dx;if(!blocked(o.x,o.y+dy,r))o.y+=dy;}
function inShelter(x,y){for(const s of SHELTERS)if(x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h)return s;return null;}
function inPur(x,y){for(const p of G.pur)if(Math.hypot(x-p.x,y-p.y)<130)return true;return false;}
function bil(f,x,y,inf){const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;const g=(i,j)=>(i<0||j<0||i>=GW||j>=GH)?inf:f[j*GW+i];return lerp(lerp(g(x0,y0),g(x0+1,y0),fx),lerp(g(x0,y0+1),g(x0+1,y0+1),fx),fy);}
function cellVal(f,x,y){return bil(f,x/CS-0.5,y/CS-0.5,f[0]);}
const tmpF=new Float32Array(GW*GH);
/* Haze physics: semi-Lagrangian advection by wind + diffusion + decay + fire emission */
function stepField(src,dst,dt,wind,inf,t,fires){
  const ax=wind.x*dt,ay=wind.y*dt;
  for(let j=0;j<GH;j++){const inl=inf*(0.8+0.4*Math.sin(j*.5+t*.3));for(let i=0;i<GW;i++)tmpF[j*GW+i]=bil(src,i-ax,j-ay,inl);}
  const df=0.12*Math.min(1,dt*2);
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const k=j*GW+i,c=tmpF[k];const a=i>0?tmpF[k-1]:c,b=i<GW-1?tmpF[k+1]:c,u=j>0?tmpF[k-GW]:c,d=j<GH-1?tmpF[k+GW]:c;dst[k]=(c+df*((a+b+u+d)/4-c))*(1-0.02*Math.min(dt,5));}
  for(const f of fires){const i=clamp(Math.floor(f.x/CS),0,GW-1),j=clamp(Math.floor(f.y/CS),0,GH-1);dst[j*GW+i]=Math.min(1,dst[j*GW+i]+0.6*Math.min(dt,1));}
  for(let k=0;k<dst.length;k++)dst[k]=clamp(dst[k],0,1);
}
function localAPI(x,y){let a=cellVal(G.haze,x,y)*500+12;if(inShelter(x,y)||inPur(x,y))a*=0.06;return a;}
function banner(a,b,col,t){G.banner={a,b,col:col||'#ffb347',t:t||4,m:t||4};}
function ftext(x,y,s,col){G.texts.push({x,y,s,col:col||'#fff',t:1.4});}
function part(x,y,n,col,spd,life,sz){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(.3,1)*spd;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*rnd(.6,1),m:life,col,sz:sz||3});}}
function randPos(minP){for(let k=0;k<300;k++){const x=rnd(80,WW-80),y=rnd(80,WH-80);if(blocked(x,y,20)||inShelter(x,y))continue;if(G&&G.p&&Math.hypot(x-G.p.x,y-G.p.y)<minP)continue;return{x,y};}return{x:1040,y:700};}

function newLevel(i){
  levelIdx=i;const L=LEVELS[i];
  G={L,t:0,p:{x:1040,y:840,hp:100,st:100,lung:0,mask:100,masks:2,bottles:1,inh:1,pur:1,tank:100,face:0,cd:0},
    civs:[],fires:[],picks:[],pur:[],parts:[],texts:[],haze:new Float32Array(GW*GH).fill(L.inflow*0.9),fc:new Float32Array(GW*GH),
    wind:{x:1.0,y:0.3},windLock:false,front:{on:false,done:false,warned:false,x:-300},spike:false,banner:null,shake:0,
    rescued:0,lost:0,doused:0,score:0,maskOut:false,
    D:{stress:0,mult:1,last:'Observing player...',why:'Collecting telemetry',tick:0,windT:25,fireT:L.fireInt*0.6,fcTxt:'Computing forecast...',fcTick:0,fcAPI:0,apiNow:0},apiNow:L.inflow*450};
  G.p.x=1040;G.p.y=840;
  for(let k=0;k<L.civs;k++){const q=randPos(300);G.civs.push({x:q.x,y:q.y,hp:100,st:'wait',tt:0,dx:0,dy:0,cough:0});}
  for(let k=0;k<L.fires0;k++)spawnFire(false);
  const kinds=['mask','mask','mask','mask','bottle','bottle','inh','inh','pur','pur'];
  for(const kd of kinds){const q=randPos(120);G.picks.push({x:q.x,y:q.y,k:kd});}
  for(let k=0;k<12;k++){const t=Math.random()*20;stepField(G.haze,G.haze,1,G.wind,L.inflow,t,G.fires);}
  banner(L.name,L.sub,'#ffd27a',5);scene='play';
}
function spawnFire(smart){
  let q=null;
  if(smart&&G.p){const n=Math.hypot(G.wind.x,G.wind.y)||1;const x=G.p.x-G.wind.x/n*380+rnd(-80,80),y=G.p.y-G.wind.y/n*380+rnd(-80,80);if(!blocked(x,y,20)&&!inShelter(x,y)&&x>0&&y>0&&x<WW&&y<WH)q={x,y};}
  if(!q&&levelIdx>=1&&Math.random()<0.5){q={x:rnd(PLANT.x+40,PLANT.x+PLANT.w-40),y:rnd(PLANT.y+40,PLANT.y+PLANT.h-40)};}
  if(!q)q=randPos(350);
  G.fires.push({x:q.x,y:q.y,hp:100,pt:0});
}

/* ---------- HAZE DIRECTOR (adaptive AI) ---------- */
function windName(w){const a=Math.atan2(w.y,w.x)*180/Math.PI;const n=['E','SE','S','SW','W','NW','N','NE'];return n[((Math.round(a/45)%8)+8)%8];}
function director(dt){
  const D=G.D,p=G.p;D.tick+=dt;D.windT-=dt;D.fireT-=dt;D.fcTick+=dt;
  const api=G.apiNow;
  if(D.tick>=1.5){D.tick=0;
    D.stress=clamp(0.45*(1-p.hp/100)+0.25*(p.lung/100)+0.2*(p.mask<=0?1:0)+0.25*Math.min(1,api/300),0,1);
    if(D.stress<0.22&&G.t>15){D.mult=Math.min(2,D.mult+0.08);D.last='Raise pressure x'+D.mult.toFixed(2);D.why='Player is coping well (stress '+(D.stress*100|0)+'%)';}
    else if(D.stress>0.6){D.mult=Math.max(0.6,D.mult-0.12);D.last='Ease pressure x'+D.mult.toFixed(2);D.why='Player struggling (stress '+(D.stress*100|0)+'%). Supply drop sent.';
      if(G.picks.length<14&&Math.random()<0.7){const a=Math.random()*6.283,x=p.x+Math.cos(a)*200,y=p.y+Math.sin(a)*200;if(!blocked(x,y,16)){G.picks.push({x,y,k:Math.random()<.6?'mask':'inh'});ftext(x,y-20,'Supply drop','#9df');}}}
    else{D.last='Hold steady x'+D.mult.toFixed(2);D.why='Flow zone: stress '+(D.stress*100|0)+'%';}
  }
  if(D.fireT<=0){D.fireT=G.L.fireInt/D.mult;if(G.fires.length<3+levelIdx*2){const smart=D.stress<0.35;spawnFire(smart);D.last='New fire ('+(smart?'upwind of player':'random')+')';D.why='Spawn interval '+(G.L.fireInt/D.mult).toFixed(0)+'s';banner('New fire hotspot detected','Smoke will drift '+windName(G.wind),'#ff8a3d',3);}}
  if(D.windT<=0&&!G.windLock){D.windT=rnd(22,38);let nw;const nf=nearestFire(p.x,p.y);
    if(nf&&D.stress<0.3){const dx=p.x-nf.x,dy=p.y-nf.y,n=Math.hypot(dx,dy)||1;nw={x:dx/n*1.3,y:dy/n*1.3};D.last='Wind shift -> '+windName(nw);D.why='Aiming smoke plume at player (they are thriving)';}
    else if(nf&&D.stress>0.6){const dx=nf.x-p.x,dy=nf.y-p.y,n=Math.hypot(dx,dy)||1;nw={x:dx/n*1.0,y:dy/n*1.0};D.last='Wind shift -> '+windName(nw);D.why='Blowing smoke away from struggling player';}
    else{const a=Math.random()*6.283;nw={x:Math.cos(a)*1.1,y:Math.sin(a)*1.1};D.last='Wind shift -> '+windName(nw);D.why='Random weather variation';}
    G.wind=nw;banner('Wind shifting '+windName(nw),'Check the forecast panel','#8fd3ff',3);}
  if(D.fcTick>=2){D.fcTick=0;let a=G.haze,b=G.fc;const t0=G.t;let cur=new Float32Array(a),nxt=new Float32Array(GW*GH);
    for(let s=0;s<8;s++){stepField(cur,nxt,5,G.wind,G.L.inflow*(G.spike?1.6:1),t0+s*5,G.fires);const x=cur;cur=nxt;nxt=x;}
    G.fc.set(cur);const fa=cellVal(cur,p.x,p.y)*500+12;D.fcAPI=fa;const here=cellVal(G.haze,p.x,p.y)*500+12;
    if(fa>here+45&&fa>110)D.fcTxt='Haze inbound from '+windName({x:-G.wind.x,y:-G.wind.y})+': API '+(here|0)+' -> '+(fa|0)+' in ~40s. Mask up!';

  for(let i=0;i<4;i++){const x=hx+i*86;ctx.fillStyle='rgba(10,8,6,.7)';rr(x,hy,78,50,8);ctx.fill();ctx.strokeStyle=items[i][2]>0?'#fff':'#555';ctx.lineWidth=1.5;ctx.stroke();T(items[i][0],x+8,hy+16,12,'#ffd27a','left','800');T(items[i][1],x+39,hy+32,12,'#fff','center','700');T('x'+items[i][2],x+39,hy+46,11,'#9cf','center','700');}
  ctx.fillStyle='rgba(10,8,6,.7)';rr(hx,hy-18,344,12,5);ctx.fill();ctx.fillStyle='#4aa8ff';rr(hx,hy-18,Math.max(6,344*p.tank/100),12,5);ctx.fill();T('WATER TANK (hold E at fire / hydrant)',hx+6,hy-8,10,'#fff','left','700');
  // minimaps
  const mw=128,mh=85,mx=VW-mw*2-22,my=VH-mh-28;
  for(let k=0;k<2;k++){const x=mx+k*(mw+6);ctx.save();ctx.beginPath();ctx.rect(x,my,mw,mh);ctx.clip();ctx.drawImage(stat,x,my,mw,mh);
    if(k===1){const d=fimg.data;for(let q=0;q<GW*GH;q++){const h=G.fc[q];d[q*4]=Math.round(lerp(190,110,h));d[q*4+1]=Math.round(lerp(130,55,h));d[q*4+2]=Math.round(lerp(70,25,h));d[q*4+3]=Math.round(clamp(h*1.15,0,.88)*255);}fctx.putImageData(fimg,0,0);ctx.drawImage(fcv,x,my,mw,mh);}else ctx.drawImage(hc,x,my,mw,mh);
    ctx.fillStyle='#4aa8ff';ctx.beginPath();ctx.arc(x+p.x/WW*mw,my+p.y/WH*mh,3,0,7);ctx.fill();ctx.fillStyle='#ff6a2a';for(const f of G.fires){ctx.fillRect(x+f.x/WW*mw-1.5,my+f.y/WH*mh-1.5,3,3);}ctx.fillStyle='#ffe27a';for(const cv2 of G.civs){ctx.fillRect(x+cv2.x/WW*mw-1,my+cv2.y/WH*mh-1,2,2);}ctx.restore();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(x,my,mw,mh);T(k?'FORECAST +40s (AI)':'NOW',x+4,my-4,10,'#fff','left','800');}
  // director panel
  if(showDir){const D=G.D,x=10,w=330,y=VH-188;ctx.fillStyle='rgba(8,12,24,.78)';rr(x,y,w,176,10);ctx.fill();ctx.strokeStyle='#5bd1ff';ctx.lineWidth=1.5;ctx.stroke();
    T('AI HAZE DIRECTOR   [Tab]',x+10,y+18,12,'#5bd1ff','left','800');
    T('Stress',x+10,y+38,11,'#ccc');ctx.fillStyle='#222';ctx.fillRect(x+55,y+29,120,10);ctx.fillStyle=D.stress>.6?'#e55':D.stress>.3?'#eb4':'#5d5';ctx.fillRect(x+55,y+29,120*D.stress,10);T('Difficulty x'+D.mult.toFixed(2),x+188,y+38,11,'#ffd27a','left','700');
    T('Decision: '+D.last,x+10,y+58,11,'#fff','left','700');wrap('Why: '+D.why,x+10,y+75,w-20,14,11,'#aab');
    ctx.fillStyle='rgba(91,209,255,.15)';ctx.fillRect(x+6,y+108,w-12,60);T('FORECAST (simulated 40s ahead)',x+12,y+122,10,'#5bd1ff','left','800');wrap(D.fcTxt,x+12,y+138,w-26,14,11,'#fff');}
  // banner
  if(G.banner){const b=G.banner,a=clamp(Math.min(b.t,b.m-b.t)*2,0,1);ctx.globalAlpha=a;ctx.fillStyle='rgba(10,5,2,.72)';rr(VW/2-300,TOP+14,600,66,12);ctx.fill();ctx.strokeStyle=b.col;ctx.lineWidth=2;ctx.stroke();T(b.a,VW/2,TOP+42,22,b.col,'center','800');T(b.b,VW/2,TOP+66,13,'#eee','center','500');ctx.globalAlpha=1;}
  T('Simulated data - not official readings',VW/2,VH-6,10,'rgba(255,255,255,.5)','center','500');
}
function menuBg(){
  skyline(0,0,VW,VH,.55+.2*Math.sin(tm*.4),tm);const g=ctx.createLinearGradient(0,VH*.5,0,VH);g.addColorStop(0,'rgba(60,30,10,0)');g.addColorStop(1,'rgba(20,10,4,.9)');ctx.fillStyle=g;ctx.fillRect(0,VH*.5,VW,VH*.5);
  const r=mkrng(3);for(let i=0;i<60;i++){const x=(r()*VW+tm*(8+r()*20))%VW,y=(r()*VH+tm*(4+r()*6))%VH;ctx.fillStyle='rgba(255,170,80,'+(.15+r()*.3)+')';ctx.beginPath();ctx.arc(x,y,1+r()*2,0,7);ctx.fill();}
}
function drawMenu(){menuBg();const cx=VW/2,pulse=1+Math.sin(tm*2)*.02;
  ctx.save();ctx.translate(cx,VH*.2);ctx.scale(pulse,pulse);ctx.shadowColor='#ff7a1a';ctx.shadowBlur=30;T('HAZE RUN',0,0,Math.min(90,VW/9),'#fff','center','900');ctx.shadowBlur=0;ctx.restore();
  T('MALAYSIA SURVIVAL CRISIS',cx,VH*.2+36,Math.min(26,VW/32),'#ffd27a','center','800');
  const bw=300,bh=48,bx=cx-bw/2;let by=VH*.38;
  btn('START MISSION',bx,by,bw,bh,startGame,'Enter');by+=60;btn('HOW TO PLAY',bx,by,bw,bh,()=>scene='help','H');by+=60;btn('LEARN ABOUT HAZE',bx,by,bw,bh,()=>scene='learn','L');by+=60;btn(muted?'SOUND: OFF':'SOUND: ON',bx,by,bw,bh,toggleMute,'M');
  T('Best run score: '+SAVE.best,cx,by+bh+30,14,'#ddd','center','600');
  const nb=Object.keys(SAVE.badges).length;T('Achievements: '+nb+' / 4  '+Object.keys(SAVE.badges).map(k=>ACH[k][0]).join(' | '),cx,by+bh+50,12,'#9cf','center','500');
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,VH-54,VW,54);ctx.font='500 12px system-ui';ctx.textAlign='center';wrapC(DISCLAIMER,cx,VH-32,VW-40,15);
}
function wrapC(s,x,y,maxw,lh){ctx.fillStyle='#ffcf8a';ctx.font='600 12px system-ui';ctx.textAlign='center';const words=s.split(' ');let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxw&&line){ctx.fillText(line,x,y);y+=lh;line=w;}else line=t;}ctx.fillText(line,x,y);}
function drawHelp(){menuBg();ctx.fillStyle='rgba(10,8,6,.82)';rr(VW/2-330,50,660,VH-110,14);ctx.fill();const x=VW/2-300;T('HOW TO PLAY',VW/2,96,30,'#ffd27a','center','800');
  const lines=['WASD / Arrows - move.   Shift - sprint (costs stamina, breathes more haze).','Hold E - rescue nearby civilians (they follow you), extinguish fires, refill tank at H2O hydrants.','1 - wear a fresh N95 mask.  2 - drink water.  3 - inhaler (heals, clears lungs).  4 - place air purifier (clean-air zone, 60s).','Lead civilians into a SHELTER (hospital, school, masjid). Shelters have clean air and heal you.','Watch the local API. Masks cut exposure by 85% but wear out faster in heavier haze.','Rescue enough civilians AND put out enough fires to clear each day. 3 days total.','The AI Haze Director watches how you play. If you are thriving it sends smoke at you; if you are struggling it eases off and drops supplies. The FORECAST map shows where the haze will be in 40s.','Expect a HAZE FRONT each day: sirens, darkness, and a wall of smoke. Get to shelter or put a mask on!','P / Esc - pause.  Tab - toggle AI panel.  M - mute.'];
  let y=135;for(const l of lines)y=wrap(l,x,y,600,19,14,'#eee')+8;
  btn('BACK',VW/2-90,VH-90,180,38,()=>scene='menu','Esc');}
function drawLearn(){menuBg();ctx.fillStyle='rgba(10,8,6,.86)';rr(VW/2-400,30,800,VH-80,14);ctx.fill();T('LEARN ABOUT HAZE IN MALAYSIA',VW/2,72,26,'#ffd27a','center','800');
  let y=104;for(const f of FACTS)y=wrap('- '+f,VW/2-370,y,740,17,13,'#eee')+7;
  wrap(DISCLAIMER,VW/2-370,y+6,740,17,13,'#ffb05a');btn('BACK',VW/2-90,VH-72,180,34,()=>scene='menu','Esc');}
function drawEnd(){
  const e=endInfo;if(G){drawWorld();}ctx.fillStyle='rgba(8,5,2,.82)';ctx.fillRect(0,0,VW,VH);
  const cx=VW/2;T(e.final?'YOU SURVIVED THE HAZE!':e.win?'DAY COMPLETE':'MISSION FAILED',cx,90,40,e.win?'#7fe08a':'#ff6a5a','center','900');
  if(!e.win)T(e.reason,cx,122,16,'#ddd','center','600');
  if(e.win){T('\u2605'.repeat(e.stars)+'\u2606'.repeat(3-e.stars),cx,165,40,'#ffd24a','center','800');}
  let y=210;const row=(a,b)=>{T(a,cx-170,y,16,'#ccc','left','600');T(b,cx+170,y,16,'#fff','right','700');y+=26;};
  row('Civilians rescued',e.rescued+' (lost '+e.lost+')');row('Fires extinguished',e.doused);row('Health left',e.hp+'%');row('Lung damage',e.lung+'%');row('Time',e.time+'s');row('Mission points',e.base);if(e.win)row('Survival bonus',e.bonus);row('LEVEL SCORE',e.total);if(e.final)row('FINAL RUN SCORE',e.run);
  if(e.badges.length){y+=4;T('Achievements: '+e.badges.map(b=>ACH[b][0]).join(' | '),cx,y,14,'#9cf','center','700');y+=24;}
  ctx.fillStyle='rgba(255,255,255,.08)';rr(cx-340,y,680,78,10);ctx.fill();T('DID YOU KNOW?',cx-326,y+20,12,'#ffd27a','left','800');wrap(e.fact,cx-326,y+40,650,17,13,'#eee');y+=100;
  if(e.win&&!e.final)btn('NEXT DAY',cx-150,y,300,44,()=>newLevel(levelIdx+1),'Enter');
  else if(!e.win)btn('RETRY DAY',cx-150,y,300,44,()=>{newLevel(levelIdx);},'Enter');
  btn('MAIN MENU',cx-150,y+54,300,40,()=>{scene='menu';},'Esc');
  T(DISCLAIMER.slice(0,80)+'...',cx,VH-12,10,'rgba(255,255,255,.4)','center','500');
}
function drawPause(){drawWorld();drawHUD();ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,VW,VH);T('PAUSED',VW/2,VH/2-30,40,'#fff','center','900');btn('RESUME',VW/2-120,VH/2,240,44,()=>scene='play','P');btn('QUIT TO MENU',VW/2-120,VH/2+54,240,44,()=>scene='menu','');}

/* ---------- INPUT / LOOP ---------- */
function startGame(){runScore=0;newLevel(0);}
function toggleMute(){muted=!muted;if(windGain&&AC)windGain.gain.value=0;}
function useItem(n){const p=G.p;
  if(n===1&&p.masks>0){p.masks--;p.mask=100;ftext(p.x,p.y-30,'Fresh N95 on','#9df');sfx.click();}
  else if(n===2&&p.bottles>0){p.bottles--;p.st=100;p.hp=Math.min(100,p.hp+8);ftext(p.x,p.y-30,'Hydrated','#8cf');sfx.click();}
  else if(n===3&&p.inh>0){p.inh--;p.lung=Math.max(0,p.lung-35);p.hp=Math.min(100,p.hp+15);ftext(p.x,p.y-30,'Breathing eased','#9f9');sfx.click();}
  else if(n===4&&p.pur>0){p.pur--;G.pur.push({x:p.x,y:p.y,t:60});ftext(p.x,p.y-30,'Purifier on (60s)','#9ff');sfx.click();}}
addEventListener('keydown',e=>{initAudio();if(['Tab','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;
  if(e.repeat)return;
  if(scene==='menu'){if(e.code==='Enter')startGame();else if(e.code==='KeyH')scene='help';else if(e.code==='KeyL')scene='learn';else if(e.code==='KeyM')toggleMute();}
  else if(scene==='help'||scene==='learn'){if(e.code==='Escape'||e.code==='Enter')scene='menu';}
  else if(scene==='play'){if(e.code==='KeyP'||e.code==='Escape')scene='pause';else if(e.code==='Tab')showDir=!showDir;else if(e.code==='KeyM')toggleMute();else if(e.code.startsWith('Digit'))useItem(+e.code.slice(5));}
  else if(scene==='pause'){if(e.code==='KeyP'||e.code==='Escape')scene='play';}
  else if(scene==='end'){if(e.code==='Enter'){if(endInfo.win&&!endInfo.final)newLevel(levelIdx+1);else if(!endInfo.win)newLevel(levelIdx);else scene='menu';}else if(e.code==='Escape')scene='menu';}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
cv.addEventListener('mousedown',e=>{initAudio();const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(const b of frameBtns)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){sfx.click();b.fn();break;}});
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;tm+=dt;frameBtns=[];
  try{
    ctx.clearRect(0,0,VW,VH);
    if(scene==='play'){update(dt);if(scene==='play'){drawWorld();drawHUD();}else if(scene==='end')drawEnd();}
    else if(scene==='menu')drawMenu();else if(scene==='help')drawHelp();else if(scene==='learn')drawLearn();
    else if(scene==='end')drawEnd();else if(scene==='pause')drawPause();
  }catch(err){console.error(err);}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__HR={get G(){return G;},get scene(){return scene;},startGame,newLevel};
})();
</script></body></html>
